AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Cloud call agent - network, ALB, ACM certificate, and ECS Fargate service (ap-northeast-1)

# Task 3.3 covers networking, load balancer, certificate, and the service.
# Task 3.4 adds data, secrets, IAM policies, and alarms to this same file. The
# TaskRole below is intentionally empty so that 3.4 only has to add policies, and
# the service environment has a marked place for the table, bucket, and secrets.
#
# DNS for leadingdots.com is on Cloudflare (docs/cloud/dns.md). This template creates
# no DNS records and no Route 53 resources. The certificate uses DNS validation and
# the CNAMEs are added by hand in Cloudflare (DNS only, proxy OFF).

Parameters:
  CognitoUserPoolId:
    Type: String
    Description: Id of the existing Cognito user pool (ap-south-1), not recreated here
  CognitoClientId:
    Type: String
    Description: App client id of the existing Cognito user pool
  CognitoRegion:
    Type: String
    Default: ap-south-1
    Description: Region of the existing Cognito user pool
  ImageUri:
    Type: String
    Description: Full container image URI to run (ECR repository of this stack, with a tag or digest)
  AgentDomainName:
    Type: String
    Default: agent.leadingdots.com
    Description: Host name for the Exotel stream and webhooks
  ApiDomainName:
    Type: String
    Default: api.leadingdots.com
    Description: Host name for the Companion API
  CertificateArn:
    Type: String
    Default: ""
    Description: Optional ARN of an already ISSUED ACM certificate in this region. When empty, the stack requests one (DNS validation).
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "1024"
    Description: Memory in MiB (1024 is valid with 512 CPU)
  ContainerPort:
    Type: Number
    Default: 8080
  LogRetentionDays:
    Type: Number
    Default: 30
  LimitsPerUser:
    Type: Number
    Default: 3
    MinValue: 1
    Description: limits.perUser, maximum simultaneous calls of one User
  LimitsGlobal:
    Type: Number
    Default: 10
    MinValue: 1
    Description: limits.global, Global_Call_Cap (maximum simultaneous calls of the whole service)
  SonicModelId:
    Type: String
    Default: amazon.nova-2-sonic-v1:0
  SonicMaxSessionSeconds:
    Type: Number
    Default: 480
  SonicIdleSeconds:
    Type: Number
    Default: 60
  AlarmEmail:
    Type: String
    Description: E-mail address subscribed to the FallbackCount alarm (the subscription must be confirmed from the mailbox)
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$

  FcmSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:ap-northeast-1:517223944896:secret:callagent/fcm-iYvBDg
    Description: ARN of the existing FCM service account secret (callagent/fcm), created outside this stack with the default aws/secretsmanager key

Conditions:
  CreateCertificate: !Equals [!Ref CertificateArn, ""]

Resources:
  # ---------- Network: VPC with two public subnets, no NAT ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---------- Security groups ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS and WSS to the ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS and WSS from Exotel and the Companion_App

  # Egress to the tasks is a separate rule to avoid a circular reference between the groups.
  AlbToTaskEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !GetAtt AlbSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      DestinationSecurityGroupId: !GetAtt TaskSecurityGroup.GroupId
      Description: ALB to tasks

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Agent_Server tasks, reachable from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !GetAtt AlbSecurityGroup.GroupId
          Description: Traffic from the ALB only (TLS ends at the ALB on 443)
      # Default egress (all) stays: Bedrock, Exotel, FCM, Cognito JWKS, and image pull over TLS.

  # ---------- Certificate: DNS validation, records added by hand in Cloudflare ----------
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateCertificate
    Properties:
      DomainName: !Ref AgentDomainName
      SubjectAlternativeNames:
        - !Ref ApiDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref AgentDomainName
        - DomainName: !Ref ApiDomainName

  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !GetAtt AlbSecurityGroup.GroupId
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "3600"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
    DependsOn: PublicDefaultRoute

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "120"   # matches the container stopTimeout so calls in progress can finish

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: Not found

  # agent host: Exotel webhooks and the media stream only.
  AgentHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref AgentDomainName]
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/exotel/*", "/stream/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # api host: the Companion API and its live stream.
  ApiHostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref ApiDomainName]
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/api/*"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- Data: KMS key, table, bucket, secrets (task 3.4) ----------
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts the CallAgent table, the recordings bucket, the secrets, and the log group
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: CloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt*
              - kms:Decrypt*
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:Describe*
            Resource: "*"
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/callagent
      TargetKeyId: !Ref DataKey
  AgentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: CallAgent
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: gsi1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL   # listings read status and other attributes without a second fetch; items are small
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
  RecordingsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub callagent-recordings-${AWS::AccountId}-ap-northeast-1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      LifecycleConfiguration:
        Rules:
          # Backstop only: the retention sweeper deletes objects under users/<sub>/ at the User's retention.
          - Id: expire-after-366-days
            Status: Enabled
            Prefix: users/
            ExpirationInDays: 366
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  RecordingsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RecordingsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt RecordingsBucket.Arn
              - !Sub ${RecordingsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
  # Values the template cannot generate are placeholders: set them once with
  # `aws secretsmanager put-secret-value` (never in this file).
  ExotelAccountSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: callagent/exotel-account
      Description: Exotel account SID, API key, and API token as JSON (set by hand after deploy)
      KmsKeyId: !GetAtt DataKey.Arn
      SecretString: '{"accountSid":"CHANGE_ME","apiKey":"CHANGE_ME","apiToken":"CHANGE_ME"}'
  ExotelStreamSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: callagent/exotel
      Description: Basic credentials Exotel presents to the stream and webhooks, as user:password (set by hand after deploy)
      KmsKeyId: !GetAtt DataKey.Arn
      SecretString: CHANGE_ME_USER:CHANGE_ME_PASSWORD
  CallTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: callagent/call-token
      Description: HMAC-SHA256 key of the 60-second call token
      KmsKeyId: !GetAtt DataKey.Arn
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  # The FCM service account secret (callagent/fcm) was created outside CloudFormation; see FcmSecretArn.
  # ---------- Container registry, cluster, logs ----------
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep the last 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays
      KmsKeyId: !GetAtt DataKey.Arn

  # ---------- Roles ----------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ExotelAccountSecret
                  - !Ref ExotelStreamSecret
                  - !Ref CallTokenSecret
                  - !Ref FcmSecretArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt DataKey.Arn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-fcm-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref FcmSecretArn

  # ---------- Service ----------
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub ${AWS::StackName}-agent
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: agent
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: 120
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: !Ref ContainerPort
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
            - Name: COGNITO_REGION
              Value: !Ref CognitoRegion
            - Name: AGENT_DOMAIN_NAME
              Value: !Ref AgentDomainName
            - Name: API_DOMAIN_NAME
              Value: !Ref ApiDomainName
            - Name: AGENT_TABLE
              Value: !Ref AgentTable
            - Name: RECORDINGS_BUCKET
              Value: !Ref RecordingsBucket
            - Name: EXOTEL_SECRET_NAME
              Value: callagent/exotel
            - Name: CALL_TOKEN_SECRET_NAME
              Value: callagent/call-token
            - Name: FCM_SECRET_NAME
              Value: callagent/fcm
            - Name: EXOTEL_ACCOUNT_SECRET_NAME
              Value: callagent/exotel-account
            - Name: SONIC_MODEL_ID
              Value: !Ref SonicModelId
            - Name: SONIC_MAX_SESSION_SECONDS
              Value: !Ref SonicMaxSessionSeconds
            - Name: SONIC_IDLE_SECONDS
              Value: !Ref SonicIdleSeconds
            - Name: LIMITS_PER_USER
              Value: !Ref LimitsPerUser
            - Name: LIMITS_GLOBAL
              Value: !Ref LimitsGlobal
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: agent

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpsListener
      - AgentHostRule
      - ApiHostRule
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !GetAtt TaskSecurityGroup.GroupId
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
      LoadBalancers:
        - ContainerName: agent
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

  # ---------- Alarms ----------
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: alias/aws/sns
  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail
  # The agent writes FallbackCount and CapRefusals as embedded metric format lines
  # (namespace CallAnswer/Agent, no dimensions), so no metric filter is needed.
  FallbackCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: More than 3 calls took the Fallback_Route in 1 hour
      Namespace: CallAnswer/Agent
      MetricName: FallbackCount
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
Outputs:
  LoadBalancerDnsName:
    Description: Target of the agent and api CNAME records in Cloudflare (DNS only)
    Value: !GetAtt LoadBalancer.DNSName
  AgentUrl:
    Value: !Sub wss://${AgentDomainName}
  ApiUrl:
    Value: !Sub https://${ApiDomainName}/api/v1
  CertificateArn:
    Value: !If [CreateCertificate, !Ref Certificate, !Ref CertificateArn]
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryName:
    Value: !Ref Repository
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskRoleName:
    Value: !Ref TaskRole
  ExecutionRoleName:
    Value: !Ref ExecutionRole
  LogGroupName:
    Value: !Ref LogGroup
  AgentTableName:
    Value: !Ref AgentTable
  RecordingsBucketName:
    Value: !Ref RecordingsBucket
  DataKeyArn:
    Value: !GetAtt DataKey.Arn
  AlarmTopicArn:
    Value: !Ref AlarmTopic
